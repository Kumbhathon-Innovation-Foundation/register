name: Register - Tower 4 (Pilgrim Experience)
description: Register your team under Tower 4 - Pilgrim Experience
title: "[Register] Tower 4: "
labels: ["registration", "tower-4"]
body:
  - type: markdown
    attributes:
      value: |
        Registering under **Tower 4 - Pilgrim Experience**. Wrong tower? Close this and open the correct link.

        One submission per team. When you submit, a bot checks it and — if valid — immediately
        creates a **private** team repo with every listed member added as **admin**. If something
        is wrong it comments why; just edit this issue to fix it and the bot retries.
  - type: input
    id: team
    attributes:
      label: Team name
      placeholder: Nashik Navigators
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Project title
      placeholder: Real-time ghat density map
    validations:
      required: true
  - type: textarea
    id: members
    attributes:
      label: GitHub usernames of ALL team members
      description: One per line or comma-separated. Include yourself. These exact accounts get admin on the repo.
      placeholder: |
        octocat
        torvalds
    validations:
      required: true
  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgement
      options:
        - label: These usernames are correct and belong to my teammates
          required: true
