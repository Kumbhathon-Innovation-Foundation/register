name: Register a project
description: Register your team and get a private repo under your tower
title: "[Register] team name here"
labels: ["registration"]
body:
  - type: markdown
    attributes:
      value: |
        One submission per team. A bot checks it, an organiser approves, then you get a
        **private repo** with every member added as admin. You'll get a GitHub notification
        to accept the repo invite.
  - type: input
    id: team
    attributes:
      label: Team name
      placeholder: Nashik Navigators
    validations:
      required: true
  - type: dropdown
    id: tower
    attributes:
      label: Tower
      options:
        - "1 - Crowd Control"
        - "2 - Hardware / IoT"
        - "3 - Information Analysis"
        - "4 - Pilgrim Experience"
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Project title
      placeholder: Real-time ghat density map
    validations:
      required: true
  - type: textarea
    id: members
    attributes:
      label: GitHub usernames of ALL team members
      description: One per line (or comma-separated). Include yourself. These exact accounts get admin on the repo.
      placeholder: |
        octocat
        torvalds
    validations:
      required: true
  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgement
      options:
        - label: These usernames are correct and belong to my teammates
          required: true
